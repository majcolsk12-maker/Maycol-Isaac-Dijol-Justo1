<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulario de Registro</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>


<div class="contenedor">
<form class="formulario">
<h2>Registro de Usuario</h2>


<label>Nombre</label>
<input type="text" placeholder="Ingrese su nombre" required>


<label>Apellido</label>
<input type="text" placeholder="Ingrese su apellido" required>


<label>Correo electrónico</label>
<input type="email" placeholder="Ingrese su correo" required>


<label>Contraseña</label>
<input type="password" placeholder="Ingrese su contraseña" required>


<label>Confirmar contraseña</label>
<input type="password" placeholder="Repita su contraseña" required>


<button type="submit">Registrarse</button>


<p class="texto">¿Ya tienes cuenta? <a href="#">Inicia sesión</a></p>
</form>
</div>


</body>
</html>
